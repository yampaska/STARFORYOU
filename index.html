<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>для тебя что угодно</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03040c;
    --text: #fff6e0;
    --gold: #ffd36b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    color: var(--text);
    font-family: "Comfortaa", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: block;
    touch-action: none;
  }

  /* ---------- подсказка ---------- */
  .hint {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(28px + env(safe-area-inset-bottom));
    text-align: center;
    font-size: clamp(14px, 3.9vw, 18px);
    letter-spacing: .4px;
    pointer-events: none;
    transition: opacity .6s;
    animation: breathe 3s ease-in-out infinite;
    text-shadow: 0 0 12px rgba(255, 211, 107, .5);
  }
  .hint.hidden { opacity: 0 !important; animation: none; }
  @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: .95; } }

  /* ---------- окно со звездой ---------- */
  .modal {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(3, 4, 14, .35);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s ease;
  }
  .modal.show { opacity: 1; pointer-events: auto; }

  .card {
    position: relative;
    width: min(340px, 100%);
    padding: 26px 22px 22px;
    border-radius: 26px;
    background: linear-gradient(160deg, rgba(48, 36, 104, .92), rgba(18, 14, 46, .95));
    border: 1px solid rgba(255, 220, 140, .28);
    box-shadow: 0 0 70px rgba(255, 200, 100, .25), 0 20px 60px rgba(0, 0, 0, .55);
    text-align: center;
    transform: scale(.55) translateY(40px);
    transition: transform .7s cubic-bezier(.2, 1.4, .4, 1);
    overflow: hidden;
  }
  .modal.show .card { transform: none; }

  .star-wrap {
    position: relative;
    width: clamp(120px, 42vw, 160px);
    aspect-ratio: 1;
    margin: 4px auto 16px;
  }
  .rays {
    position: absolute;
    inset: -30%;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255, 214, 120, .22) 0 7deg, transparent 7deg 20deg);
    -webkit-mask-image: radial-gradient(circle, #000 25%, transparent 68%);
    mask-image: radial-gradient(circle, #000 25%, transparent 68%);
    animation: spin 14s linear infinite;
  }
  .halo {
    position: absolute;
    inset: -6%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 220, 130, .55), transparent 62%);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .big-star {
    position: relative;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 14px rgba(255, 210, 100, .9));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(4deg); } }

  .msg {
    margin: 0 0 20px;
    font-size: clamp(17px, 4.8vw, 20px);
    font-weight: 700;
    line-height: 1.5;
    text-wrap: balance;
  }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    color: #3a2400;
    background: linear-gradient(#ffe7a6, #ffc24d);
    border: 0;
    border-radius: 999px;
    padding: 12px 24px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 190, 80, .45);
    transition: transform .15s;
  }
  .btn:active { transform: scale(.95); }

  /* искорки внутри окна */
  .spark {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #fff3c4;
    box-shadow: 0 0 8px 2px rgba(255, 220, 140, .8);
    opacity: 0;
    animation: twinkle 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .rays, .halo, .big-star, .spark, .hint { animation: none; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="hint" id="hint">нажми на любую звезду ✨</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="msg">
    <span class="spark" style="left:12%;top:14%;animation-delay:.2s"></span>
    <span class="spark" style="left:84%;top:10%;animation-delay:1.1s"></span>
    <span class="spark" style="left:8%;top:62%;animation-delay:1.7s"></span>
    <span class="spark" style="left:90%;top:55%;animation-delay:.6s"></span>
    <span class="spark" style="left:50%;top:4%;animation-delay:1.4s"></span>

    <div class="star-wrap">
      <div class="rays"></div>
      <div class="halo"></div>
      <svg class="big-star" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="starFill" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fffbe6"/>
            <stop offset="45%" stop-color="#ffe08a"/>
            <stop offset="100%" stop-color="#ffb52e"/>
          </radialGradient>
        </defs>
        <path d="M50 4 L61.17 34.63 L93.75 35.79 L68.07 55.87 L77.04 87.21 L50 69 L22.96 87.21 L31.93 55.87 L6.25 35.79 L38.83 34.63 Z"
              fill="url(#starFill)" stroke="#ffcf5a" stroke-width="5" stroke-linejoin="round"/>
        <!-- мордочка :3 -->
        <ellipse cx="42" cy="50" rx="2.6" ry="3.4" fill="#4a2a00"/>
        <ellipse cx="58" cy="50" rx="2.6" ry="3.4" fill="#4a2a00"/>
        <circle cx="42.9" cy="48.8" r=".9" fill="#fff"/>
        <circle cx="58.9" cy="48.8" r=".9" fill="#fff"/>
        <ellipse cx="36" cy="57" rx="4" ry="2.4" fill="#ff8fa3" opacity=".6"/>
        <ellipse cx="64" cy="57" rx="4" ry="2.4" fill="#ff8fa3" opacity=".6"/>
        <path d="M45 56.5 q2.5 3.2 5 0 q2.5 3.2 5 0" fill="none" stroke="#4a2a00" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>

    <p class="msg" id="msg">я же говорил, что для тебя хоть звезду с неба :3</p>
    <button class="btn" id="again" type="button">ещё одну ✨</button>
  </div>
</div>

<script>
(() => {
  const cvs = document.getElementById('sky');
  const ctx = cvs.getContext('2d');
  const hint = document.getElementById('hint');
  const modal = document.getElementById('modal');
  const againBtn = document.getElementById('again');

  let W, H, DPR, S;
  let stars = [];
  let particles = [];
  let shooting = [];
  let anim = null;
  let hover = null;
  let nextShoot = 2000;

  const bg = document.createElement('canvas');

  // ---------- утилиты ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpP = (p, q, t) => ({ x: lerp(p.x, q.x, t), y: lerp(p.y, q.y, t) });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  function makeGlow(rgb) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${rgb},1)`);
    gr.addColorStop(.15, `rgba(${rgb},.75)`);
    gr.addColorStop(.4, `rgba(${rgb},.15)`);
    gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return c;
  }
  const glowWhite = makeGlow('255,255,255');
  const glowGold = makeGlow('255,205,110');

  const STAR_COLORS = ['#ffffff', '#ffffff', '#fff4d6', '#dfe8ff', '#cfe0ff', '#ffe0c2', '#ffd6f0'];

  // ---------- размеры и фон ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = clamp(Math.min(W, H) / 600, .75, 1.4);
    makeBg();
    if (!stars.length) makeStars();
  }

  function makeStars() {
    const n = Math.round(clamp(W * H / 2200, 140, 520));
    stars = [];
    for (let i = 0; i < n; i++) {
      const big = Math.random() < .09;
      stars.push({
        fx: Math.random(),
        fy: Math.random() * .92,
        r: big ? rand(1.5, 2.6) : rand(.4, 1.3),
        ph: rand(0, Math.PI * 2),
        sp: rand(.6, 2.4),
        c: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
        big
      });
    }
  }

  function makeBg() {
    bg.width = cvs.width;
    bg.height = cvs.height;
    const b = bg.getContext('2d');
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    const lg = b.createLinearGradient(0, 0, 0, H);
    lg.addColorStop(0, '#02030a');
    lg.addColorStop(.55, '#0a0f2b');
    lg.addColorStop(1, '#221747');
    b.fillStyle = lg;
    b.fillRect(0, 0, W, H);

    // млечный путь
    b.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 80; i++) {
      const t = Math.random();
      const x = t * W * 1.3 - W * .15;
      const y = H * .9 - t * H * .8 + (Math.random() - .5) * H * .2;
      const r = rand(40, 140) * S;
      const col = Math.random() < .5 ? '120,110,230' : '210,120,210';
      const rg = b.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(${col},.055)`);
      rg.addColorStop(1, `rgba(${col},0)`);
      b.fillStyle = rg;
      b.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // звёздная пыль
    const dust = W * H / 700;
    for (let i = 0; i < dust; i++) {
      b.fillStyle = `rgba(255,255,255,${rand(.08, .45)})`;
      const s = rand(.3, .9);
      b.fillRect(Math.random() * W, Math.random() * H, s, s);
    }
    b.globalCompositeOperation = 'source-over';
  }

  // ---------- рисование неба ----------
  function drawStars(time) {
    for (const s of stars) {
      const x = s.fx * W, y = s.fy * H;
      const tw = .5 + .5 * Math.sin(time * s.sp + s.ph);
      const a = s.big ? .65 + .35 * tw : .25 + .75 * tw;
      const g = s.r * (s.big ? 10 : 6);
      ctx.globalAlpha = a;
      ctx.drawImage(glowWhite, x - g / 2, y - g / 2, g, g);
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.big) {
        const l = s.r * (3 + 3 * tw);
        ctx.strokeStyle = s.c;
        ctx.lineWidth = .7;
        ctx.beginPath();
        ctx.moveTo(x - l, y); ctx.lineTo(x + l, y);
        ctx.moveTo(x, y - l); ctx.lineTo(x, y + l);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    if (hover && !anim) {
      const x = hover.fx * W, y = hover.fy * H;
      const g = 34 + 4 * Math.sin(time * 4);
      ctx.globalAlpha = .55;
      ctx.drawImage(glowGold, x - g / 2, y - g / 2, g, g);
      ctx.globalAlpha = 1;
    }
  }

  function drawShooting(dt) {
    nextShoot -= dt;
    if (nextShoot <= 0) {
      nextShoot = rand(3500, 9000);
      const ang = rand(.35, .7);
      const sp = rand(.7, 1.1) * Math.max(W, H) / 1000;
      shooting.push({ x: rand(0, W * .8), y: rand(0, H * .35), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0, max: rand(700, 1100) });
    }
    for (let i = shooting.length - 1; i >= 0; i--) {
      const s = shooting[i];
      s.life += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      const k = s.life / s.max;
      if (k >= 1) { shooting.splice(i, 1); continue; }
      const a = Math.sin(k * Math.PI);
      const tx = s.x - s.vx * 120, ty = s.y - s.vy * 120;
      const gr = ctx.createLinearGradient(s.x, s.y, tx, ty);
      gr.addColorStop(0, `rgba(255,255,255,${a})`);
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = gr;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
    }
  }

  // ---------- частицы ----------
  function emit(x, y, n, speed, gold = true) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const v = rand(.2, 1) * speed;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rand(500, 1200), size: rand(4, 12) * S, gold });
    }
  }
  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= .985; p.vy *= .985;
      const k = 1 - p.life / p.max;
      ctx.globalAlpha = k;
      const s = p.size * (.5 + k * .5);
      ctx.drawImage(p.gold ? glowGold : glowWhite, p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- звезда-«пятиконечка» ----------
  function starPath(c, R, inner = .45) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? R * inner : R;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    c.closePath();
  }
  function drawHeldStar(x, y, R, rot) {
    ctx.save();
    ctx.translate(x, y);
    const g = R * 6;
    ctx.globalAlpha = .9;
    ctx.drawImage(glowGold, -g / 2, -g / 2, g, g);
    ctx.globalAlpha = 1;
    ctx.rotate(rot);
    starPath(ctx, R);
    const gr = ctx.createRadialGradient(0, -R * .2, 0, 0, 0, R);
    gr.addColorStop(0, '#fffbe6');
    gr.addColorStop(.5, '#ffe08a');
    gr.addColorStop(1, '#ffb52e');
    ctx.fillStyle = gr;
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(1, R * .12);
    ctx.strokeStyle = '#ffcf5a';
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // ---------- руки ----------
  // Мягкие руки: без тёмных контуров, объём за счёт градиента,
  // тёплое свечение по краю, аккуратные пальчики с ноготками.

  function roundRect(c, x, y, w, h, r) {
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // сужающаяся «капсула» от (x1,y1) к (x2,y2)
  function capsule(c, x1, y1, x2, y2, w1, w2) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    const nx = Math.cos(a + Math.PI / 2), ny = Math.sin(a + Math.PI / 2);
    c.moveTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
    c.lineTo(x2 + nx * w2 / 2, y2 + ny * w2 / 2);
    c.arc(x2, y2, w2 / 2, a + Math.PI / 2, a - Math.PI / 2, true);
    c.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2);
    c.arc(x1, y1, w1 / 2, a - Math.PI / 2, a + Math.PI / 2, true);
    c.closePath();
  }

  // тыльная сторона ладони + запястье
  function handBack(c) {
    c.moveTo(-24, 22);
    c.quadraticCurveTo(0, 12, 24, 22);
    c.bezierCurveTo(26, 42, 21, 56, 16.5, 68);
    c.lineTo(16.5, 122);
    c.lineTo(-16.5, 122);
    c.lineTo(-16.5, 68);
    c.bezierCurveTo(-21, 56, -26, 42, -24, 22);
    c.closePath();
  }

  function skinGradient() {
    const g = ctx.createLinearGradient(-27, 0, 27, 0);
    g.addColorStop(0, '#e2a98a');
    g.addColorStop(.32, '#f7d2b8');
    g.addColorStop(.55, '#ffe7d6');
    g.addColorStop(.8, '#f4c9ad');
    g.addColorStop(1, '#dca385');
    return g;
  }

  function fingerGeom(t, grip) {
    return [
      { x: t * 14.5, L: 38, w: 10.4 }, // указательный
      { x: t * 5, L: 43, w: 10.8 },    // средний
      { x: -t * 5, L: 39, w: 10.2 },   // безымянный
      { x: -t * 14, L: 30, w: 9.2 }    // мизинец
    ].map(f => {
      const L = f.L * (1 - .62 * grip);
      return { ...f, bx: f.x, by: 26, tx: f.x * lerp(1.28, .86, grip), ty: 26 - L };
    });
  }

  function thumbGeom(t, grip) {
    return {
      bx: t * 18, by: 46,
      mx: lerp(t * 30, t * 28, grip), my: lerp(26, 20, grip),
      tx: lerp(t * 33, t * 21, grip), ty: lerp(6, 0, grip)
    };
  }

  function nail(x, y, bx, by, alpha) {
    if (alpha <= 0) return;
    const a = Math.atan2(y - by, x - bx);
    const cx = x - Math.cos(a) * 3.2, cy = y - Math.sin(a) * 3.2;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.rotate(a + Math.PI / 2);
    const g = ctx.createLinearGradient(0, -4, 0, 4);
    g.addColorStop(0, '#fff4f0');
    g.addColorStop(1, '#f6c4c0');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, 3, 3.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // g – точка хвата (между пальцами), base – откуда растёт рука,
  // side: -1 левая, +1 правая; pass 0 – рука/ладонь/пальцы, pass 1 – большой палец
  function drawHand(g, base, grip, side, k, pass) {
    const ang = Math.atan2(g.y - base.y, g.x - base.x);
    const dist = Math.hypot(g.x - base.x, g.y - base.y);
    const t = -side; // большой палец смотрит внутрь, к звезде
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(ang + Math.PI / 2);
    ctx.scale(k, k);
    const skin = skinGradient();
    const open = clamp(1 - grip * 1.6, 0, 1);

    if (pass === 1) {
      // большой палец поверх звезды
      const th = thumbGeom(t, grip);
      const path = () => {
        ctx.beginPath();
        capsule(ctx, th.bx, th.by, th.mx, th.my, 13, 11.5);
        capsule(ctx, th.mx, th.my, th.tx, th.ty, 11.5, 10);
      };
      ctx.fillStyle = skin;
      ctx.shadowColor = 'rgba(150, 80, 50, .45)';
      ctx.shadowBlur = 5 * k * DPR;
      path(); ctx.fill();
      ctx.shadowColor = 'transparent';
      path(); ctx.fill();
      nail(th.tx, th.ty, th.mx, th.my, .85 * open + .25);
      ctx.restore();
      return;
    }

    const armEnd = dist / k + 400;

    // рукав свитера
    const sl = ctx.createLinearGradient(-32, 0, 32, 0);
    sl.addColorStop(0, '#5a4892');
    sl.addColorStop(.45, '#a68de0');
    sl.addColorStop(.6, '#9b80d8');
    sl.addColorStop(1, '#55438a');
    ctx.fillStyle = sl;
    ctx.beginPath();
    roundRect(ctx, -30, 112, 60, armEnd, 14);
    ctx.fill();
    // вязаный узор «косичка»
    ctx.strokeStyle = 'rgba(255, 255, 255, .09)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (let y = 150; y < Math.min(armEnd, 900); y += 12) {
      ctx.beginPath();
      ctx.moveTo(-6, y); ctx.lineTo(0, y + 6); ctx.lineTo(6, y);
      ctx.stroke();
    }
    // сердечко на рукаве
    ctx.save();
    ctx.translate(0, 185);
    ctx.fillStyle = '#ffa8c6';
    ctx.globalAlpha = .9;
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(-9, -2, -5, -10, 0, -5);
    ctx.bezierCurveTo(5, -10, 9, -2, 0, 5);
    ctx.fill();
    ctx.restore();

    // кожа: сначала с тёплым свечением, затем чисто поверх
    const fingers = fingerGeom(t, grip);
    const skinPath = () => {
      ctx.beginPath();
      for (const f of fingers) capsule(ctx, f.bx, f.by, f.tx, f.ty, f.w, f.w * .88);
      handBack(ctx);
    };
    ctx.fillStyle = skin;
    ctx.shadowColor = 'rgba(255, 205, 130, .55)';
    ctx.shadowBlur = 16 * k * DPR;
    skinPath(); ctx.fill();
    ctx.shadowColor = 'transparent';
    for (const f of fingers) {
      ctx.beginPath(); capsule(ctx, f.bx, f.by, f.tx, f.ty, f.w, f.w * .88); ctx.fill();
    }
    ctx.beginPath(); handBack(ctx); ctx.fill();

    // мягкая тень между пальцами
    ctx.strokeStyle = 'rgba(190, 120, 95, .22)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < fingers.length - 1; i++) {
      const a = fingers[i], b = fingers[i + 1];
      const mx = (a.bx + b.bx) / 2;
      ctx.beginPath();
      ctx.moveTo(mx, 24);
      ctx.lineTo((a.tx + b.tx) / 2, Math.max(a.ty, b.ty) + 6);
      ctx.stroke();
    }

    // ноготки и блики на костяшках
    for (const f of fingers) nail(f.tx, f.ty, f.bx, f.by, .85 * open);
    ctx.fillStyle = 'rgba(255, 255, 255, .28)';
    for (const f of fingers) {
      ctx.beginPath();
      ctx.ellipse(f.bx, 23 + grip * 2, 3.6, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // лёгкий румянец на костяшках
    ctx.fillStyle = 'rgba(255, 150, 150, .12)';
    ctx.beginPath();
    ctx.ellipse(0, 26, 20, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // манжета поверх запястья
    const cf = ctx.createLinearGradient(-33, 0, 33, 0);
    cf.addColorStop(0, '#7a64b8');
    cf.addColorStop(.5, '#c9b6f3');
    cf.addColorStop(1, '#7462b0');
    ctx.fillStyle = cf;
    ctx.beginPath();
    roundRect(ctx, -32, 98, 64, 26, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90, 70, 150, .35)';
    ctx.lineWidth = 1.6;
    for (let x = -24; x <= 24; x += 6) {
      ctx.beginPath(); ctx.moveTo(x, 103); ctx.lineTo(x, 119); ctx.stroke();
    }

    ctx.restore();
  }

  // ---------- анимация «достать звезду» ----------
  const T = { reach: 1500, grab: 450, pull: 1600, give: 650, retract: 1100 };

  function startGrab(s) {
    stars = stars.filter(x => x !== s);
    hover = null;
    cvs.style.cursor = 'default';
    hint.classList.add('hidden');
    anim = { s, t0: performance.now(), grabbed: false, burst: false, modal: false };
  }

  function updateAnim(now) {
    let t = now - anim.t0;
    const sx = anim.s.fx * W, sy = anim.s.fy * H;
    const C = { x: W / 2, y: H * .55 };
    const baseL = { x: W * .2, y: H + 150 * S };
    const baseR = { x: W * .8, y: H + 150 * S };
    const startR = Math.max(5 * S, anim.s.r * 2.5);
    const at = (c, spread, k) => [{ x: c.x - spread * k, y: c.y - 2 * k }, { x: c.x + spread * k, y: c.y - 2 * k }];

    let gl, gr, k = S, grip = 0, star = null, rot = 0, flash = 0;

    if (t < T.reach) {
      const p = easeInOut(t / T.reach);
      const [tl, tr] = at({ x: sx, y: sy }, 42, k);
      gl = lerpP(baseL, tl, p);
      gr = lerpP(baseR, tr, p);
      grip = .08 * Math.sin(t / 140);
      star = { x: sx, y: sy, R: startR * (1 + .25 * Math.sin(t / 90) * p) };
    } else if ((t -= T.reach) < T.grab) {
      const p = t / T.grab;
      if (!anim.grabbed) { anim.grabbed = true; emit(sx, sy, 18, .25 * S); }
      grip = clamp(easeOutBack(p), 0, 1.05);
      [gl, gr] = at({ x: sx, y: sy }, lerp(42, 34, p), k);
      star = { x: sx, y: sy, R: lerp(startR, 8 * S, p) };
    } else if ((t -= T.grab) < T.pull) {
      const p = easeInOut(t / T.pull);
      const c = { x: lerp(sx, C.x, p), y: lerp(sy, C.y, p) - Math.sin(p * Math.PI) * 30 * S };
      k = S * (1 + .8 * p);
      grip = 1;
      [gl, gr] = at(c, 34, k);
      const wob = Math.sin(t / 110) * 1.5 * S;
      gl.y += wob; gr.y -= wob;
      rot = Math.sin(t / 300) * .15;
      star = { x: c.x, y: c.y, R: lerp(8 * S, 30 * S, p) };
      if (Math.random() < .25) emit(c.x, c.y, 1, .08 * S);
    } else if ((t -= T.pull) < T.give) {
      const p = easeInOut(t / T.give);
      k = S * 1.8;
      grip = 1 - .85 * p;
      [gl, gr] = at(C, lerp(34, 48, p), k);
      star = { x: C.x, y: C.y, R: 30 * S * (1 + .25 * Math.sin(p * Math.PI)) };
      flash = p;
      if (!anim.burst && p > .5) { anim.burst = true; emit(C.x, C.y, 40, .5 * S); }
    } else {
      t -= T.give;
      if (!anim.modal) { anim.modal = true; openModal(); }
      const p = easeInOut(clamp(t / T.retract, 0, 1));
      const [fl, fr] = at(C, 48, S * 1.8);
      gl = lerpP(fl, baseL, p);
      gr = lerpP(fr, baseR, p);
      k = lerp(S * 1.8, S, p);
      grip = .15 * (1 - p);
      flash = 1 - clamp(t / 500, 0, 1);
      if (p >= 1) { anim = null; return; }
    }

    drawHand(gl, baseL, grip, -1, k, 0);
    drawHand(gr, baseR, grip, 1, k, 0);
    if (star) drawHeldStar(star.x, star.y, star.R, rot);
    drawHand(gl, baseL, grip, -1, k, 1);
    drawHand(gr, baseR, grip, 1, k, 1);

    if (flash > 0) {
      const r = Math.max(W, H) * (.3 + flash * .9);
      ctx.globalAlpha = flash * .65;
      ctx.drawImage(glowGold, C.x - r / 2, C.y - r / 2, r, r);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- окно ----------
  function openModal() {
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
    setTimeout(() => againBtn.focus({ preventScroll: true }), 300);
  }
  function closeModal() {
    if (!modal.classList.contains('show')) return;
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
    againBtn.blur();
    hint.classList.remove('hidden');
  }
  againBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ---------- ввод ----------
  function pick(px, py, touch) {
    const R = touch ? 44 : 28;
    let best = null, bd = Infinity;
    for (const s of stars) {
      const d = Math.hypot(s.fx * W - px, s.fy * H - py);
      if (d < R) {
        const score = d - s.r * 8;
        if (score < bd) { bd = score; best = s; }
      }
    }
    return best;
  }

  cvs.addEventListener('pointermove', e => {
    if (anim || e.pointerType !== 'mouse') return;
    hover = pick(e.clientX, e.clientY, false);
    cvs.style.cursor = hover ? 'pointer' : 'default';
  });

  cvs.addEventListener('pointerdown', e => {
    if (anim || modal.classList.contains('show')) return;
    const s = pick(e.clientX, e.clientY, e.pointerType !== 'mouse');
    if (s) startGrab(s);
    else emit(e.clientX, e.clientY, 6, .12 * S, false);
  });

  // ---------- цикл ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last);
    last = now;
    ctx.drawImage(bg, 0, 0, W, H);
    drawStars(now / 1000);
    drawShooting(dt);
    drawParticles(dt);
    if (anim) updateAnim(now);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
